openapi: 3.0.0
info:
  title: Web PubSub Chat API
  version: 1.0.0
  description: |
    Web PubSub chat invocation and notification payloads. Invocations use
    the chat. prefix and are not HTTP operations.

x-chat-invocations:
  login:
    parameters: { $ref: '#/components/schemas/EmptyObject' }
    response: { $ref: '#/components/schemas/UserProfile' }
  getCurrentUserProperties:
    parameters: { $ref: '#/components/schemas/EmptyObject' }
    response: { $ref: '#/components/schemas/JsonObject' }
  setCurrentUserProperties:
    parameters: { $ref: '#/components/schemas/JsonObject' }
    response: { $ref: '#/components/schemas/EmptyObject' }
  getUserProperties:
    parameters: { $ref: '#/components/schemas/SingleUser' }
    response: { $ref: '#/components/schemas/JsonObject' }
  getCurrentUserStatus:
    parameters: { $ref: '#/components/schemas/EmptyObject' }
    response: { $ref: '#/components/schemas/NullableJsonObject' }
  setCurrentUserStatus:
    parameters: { $ref: '#/components/schemas/NullableJsonObject' }
    response: { $ref: '#/components/schemas/EmptyObject' }
  getUserStatus:
    parameters: { $ref: '#/components/schemas/SingleUser' }
    response: { $ref: '#/components/schemas/NullableJsonObject' }
  subscribeUserStatus:
    parameters: { $ref: '#/components/schemas/SingleUser' }
    response: { $ref: '#/components/schemas/EmptyObject' }
  unsubscribeUserStatus:
    parameters: { $ref: '#/components/schemas/SingleUser' }
    response: { $ref: '#/components/schemas/EmptyObject' }
  getRoom:
    parameters: { $ref: '#/components/schemas/GetRoomOptions' }
    response: { $ref: '#/components/schemas/RoomInfo' }
  updateRoomProperties:
    parameters: { $ref: '#/components/schemas/UpdateRoomPropertiesRequest' }
    response: { $ref: '#/components/schemas/EmptyObject' }
  createRoom:
    parameters: { $ref: '#/components/schemas/CreateRoomRequest' }
    response: { $ref: '#/components/schemas/RoomInfo' }
  getRoomMembers:
    parameters: { $ref: '#/components/schemas/SingleRoom' }
    response: { $ref: '#/components/schemas/GetRoomMembersResponse' }
  leaveRoom:
    parameters: { $ref: '#/components/schemas/SingleRoom' }
    response: { $ref: '#/components/schemas/EmptyObject' }
  manageRoomMember:
    parameters: { $ref: '#/components/schemas/ManageRoomMemberRequest' }
    response: { $ref: '#/components/schemas/EmptyObject' }
  createConversation:
    parameters: { $ref: '#/components/schemas/CreateConversationOptions' }
    response: { $ref: '#/components/schemas/ChatConversation' }
  queryMessageHistory:
    parameters: { $ref: '#/components/schemas/MessageRangeQuery' }
    response: { $ref: '#/components/schemas/QueryMessageHistoryResponse' }
  sendTextMessage:
    parameters: { $ref: '#/components/schemas/CreateTextMessage' }
    response: { $ref: '#/components/schemas/SendMessageResponse' }
  sendMessage:
    parameters: { $ref: '#/components/schemas/CreateMessageRequest' }
    response: { $ref: '#/components/schemas/SendMessageResponse' }
  editMessage:
    parameters: { $ref: '#/components/schemas/EditMessageRequest' }
    response: { $ref: '#/components/schemas/EmptyObject' }
  reactToMessage:
    parameters: { $ref: '#/components/schemas/ReactToMessageOptions' }
    response: { $ref: '#/components/schemas/EmptyObject' }
  dereference:
    parameters: { $ref: '#/components/schemas/DereferenceRequest' }
    response: { $ref: '#/components/schemas/DereferenceResult' }

paths: {}

components:
  schemas:
    EmptyObject:
      type: object
      additionalProperties: false

    JsonObject:
      type: object
      additionalProperties: true

    NullableJsonObject:
      type: object
      nullable: true
      additionalProperties: true

    NotificationType:
      type: string
      enum:
        - MessageCreated
        - MessageUpdated
        - MessageReactionUpdated
        - MessageDeleted
        - RoomJoined
        - RoomLeft
        - RoomClosed
        - RoomMemberJoined
        - RoomMemberLeft
        - AddContact
        - UserStatusUpdated
    
    Notification:
      oneOf:
        - type: object
          properties:
            notificationType: { type: string, enum: [MessageCreated] }
            body: { $ref: '#/components/schemas/NewMessageNotificationBody' }
          required: [notificationType, body]
        - type: object
          properties:
            notificationType: { type: string, enum: [MessageUpdated] }
            body: { $ref: '#/components/schemas/UpdateMessageNotificationBody' }
          required: [notificationType, body]
        - type: object
          properties:
            notificationType: { type: string, enum: [MessageReactionUpdated] }
            body: { $ref: '#/components/schemas/MessageReactionUpdatedNotificationBody' }
          required: [notificationType, body]
        - type: object
          properties:
            notificationType: { type: string, enum: [RoomJoined] }
            body: { $ref: '#/components/schemas/NewRoomNotificationBody' }
          required: [notificationType, body]
        - type: object
          properties:
            notificationType: { type: string, enum: [RoomLeft] }
            body: { $ref: '#/components/schemas/RoomLeftNotificationBody' }
          required: [notificationType, body]
        - type: object
          properties:
            notificationType: { type: string, enum: [RoomMemberJoined] }
            body: { $ref: '#/components/schemas/MemberJoinedNotificationBody' }
          required: [notificationType, body]
        - type: object
          properties:
            notificationType: { type: string, enum: [RoomMemberLeft] }
            body: { $ref: '#/components/schemas/MemberLeftNotificationBody' }
          required: [notificationType, body]
        - type: object
          properties:
            notificationType: { type: string, enum: [UserStatusUpdated] }
            body: { $ref: '#/components/schemas/UserStatusUpdatedNotificationBody' }
          required: [notificationType, body]
        - type: object
          properties:
            notificationType: { type: string, enum: [MessageDeleted] }
            body: { $ref: '#/components/schemas/MessageDeletedNotificationBody' }
          required: [notificationType, body]
        - type: object
          properties:
            notificationType: { type: string, enum: [RoomClosed] }
            body: { $ref: '#/components/schemas/RoomClosedNotificationBody' }
          required: [notificationType, body]
        - type: object
          properties:
            notificationType: { type: string, enum: [AddContact] }
            body: { $ref: '#/components/schemas/AddContactNotificationBody' }
          required: [notificationType, body]
    
    NewMessageNotificationBody:
      type: object
      properties:
        conversation:
          $ref: '#/components/schemas/ChatConversation'
        message:
          $ref: '#/components/schemas/MessageInfo'
      required:
        - conversation
        - message
    
    NewMessageNotification:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          properties:
            notificationType:
              type: string
              enum: [MessageCreated]
            body:
              $ref: '#/components/schemas/NewMessageNotificationBody'
    NewRoomNotificationBody:
      type: object
      properties:
        roomId:
          type: string
        title:
          type: string
        defaultConversationId:
          type: string
      required:
        - roomId
        - title
        - defaultConversationId
    
    NewRoomNotification:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          properties:
            notificationType:
              type: string
              enum: [RoomJoined]
            body:
              $ref: '#/components/schemas/NewRoomNotificationBody'
    
    UpdateMessageNotificationBody:
      type: object
      properties:
        conversation:
          $ref: '#/components/schemas/ChatConversation'
        message:
          $ref: '#/components/schemas/MessageInfo'
      required:
        - conversation
        - message
    
    UpdateMessageNotification:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          properties:
            notificationType:
              type: string
              enum: [MessageUpdated]
            body:
              $ref: '#/components/schemas/UpdateMessageNotificationBody'

    MessageReactionUpdatedNotificationBody:
      type: object
      properties:
        conversation:
          $ref: '#/components/schemas/ChatConversation'
        messageId:
          type: string
        reactions:
          type: array
          items:
            type: string
        userId:
          type: string
      required: [conversation, messageId, reactions, userId]

    MessageReactionUpdatedNotification:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          properties:
            notificationType:
              type: string
              enum: [MessageReactionUpdated]
            body:
              $ref: '#/components/schemas/MessageReactionUpdatedNotificationBody'

    UserStatusUpdatedNotificationBody:
      type: object
      properties:
        userId:
          type: string
        status:
          $ref: '#/components/schemas/NullableJsonObject'
      required: [userId, status]

    UserStatusUpdatedNotification:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          properties:
            notificationType:
              type: string
              enum: [UserStatusUpdated]
            body:
              $ref: '#/components/schemas/UserStatusUpdatedNotificationBody'
    
    AddContactNotificationBody:
      type: object
      properties:
        userId:
          type: string
      required:
        - userId
    
    AddContactNotification:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          properties:
            notificationType:
              type: string
              enum: [AddContact]
            body:
              $ref: '#/components/schemas/AddContactNotificationBody'
    
    MemberJoinedNotificationBody:
      type: object
      properties:
        roomId:
          type: string
        title:
          type: string
        userId:
          type: string
        defaultConversationId:
          type: string
      required:
        - roomId
        - title
        - userId
        - defaultConversationId
    
    MemberJoinedNotification:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          properties:
            notificationType:
              type: string
              enum: [RoomMemberJoined]
            body:
              $ref: '#/components/schemas/MemberJoinedNotificationBody'

    MemberLeftNotificationBody:
      type: object
      properties:
        roomId:
          type: string
        title:
          type: string
        userId:
          type: string
        defaultConversationId:
          type: string
      required:
        - roomId
        - title
        - userId
        - defaultConversationId

    MemberLeftNotification:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          properties:
            notificationType:
              type: string
              enum: [RoomMemberLeft]
            body:
              $ref: '#/components/schemas/MemberLeftNotificationBody'

    RoomLeftNotificationBody:
      type: object
      properties:
        roomId:
          type: string
        title:
          type: string
        defaultConversationId:
          type: string
      required:
        - roomId
        - title
        - defaultConversationId

    RoomLeftNotification:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          properties:
            notificationType:
              type: string
              enum: [RoomLeft]
            body:
              $ref: '#/components/schemas/RoomLeftNotificationBody'

    RoomClosedNotificationBody:
      type: object
      properties:
        roomId:
          type: string
        title:
          type: string
      required:
        - roomId
        - title

    RoomClosedNotification:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          properties:
            notificationType:
              type: string
              enum: [RoomClosed]
            body:
              $ref: '#/components/schemas/RoomClosedNotificationBody'

    MessageDeletedNotificationBody:
      type: object
      properties:
        conversation:
          $ref: '#/components/schemas/ChatConversation'
        messageId:
          type: string
      required:
        - conversation
        - messageId

    MessageDeletedNotification:
      allOf:
        - $ref: '#/components/schemas/Notification'
        - type: object
          properties:
            notificationType:
              type: string
              enum: [MessageDeleted]
            body:
              $ref: '#/components/schemas/MessageDeletedNotificationBody'
    
    UserProfile:
      type: object
      properties:
        userId:
          type: string
          description: Unique identifier for the user
          example: "user123"
        roomIds:
          type: array
          items:
            type: string
          description: Array of room IDs the user is in
          example: ["room1", "room2", "room3"]
        conversationIds:
          type: array
          items:
            type: string
          description: Legacy optional conversation IDs; not part of the current login contract.
        properties:
          $ref: '#/components/schemas/JsonObject'
        status:
          $ref: '#/components/schemas/JsonObject'
      required:
        - userId
        - roomIds
    
    ListUserConversationRequest:
      type: object
      properties:
        continuationToken:
          type: string
          nullable: true
        maxCount:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1000
          nullable: true
    
    ListUserConversationResponse:
      type: object
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/ChatConversation'
        continuationToken:
          type: string
          nullable: true
      required:
        - conversations
    
    ChatConversation:
      type: object
      description: |
        Identify a conversation by conversationId, by roomId and topicId, or
        by roomId alone for the default topic. If both forms are supplied they
        must agree. Responses include all three fields; conversationId has the
        form c.{roomId}.{topicId}.
      properties:
        roomId:
          type: string
          nullable: true
        topicId:
          type: string
          nullable: true
        conversationId:
          type: string
          nullable: true
    
    ApprovalEnum:
      type: string
      enum:
        - AutoApprove
        - ManualApprove
        - AutoDeny
    
    UserPolicy:
      type: object
      properties:
        addContact:
          $ref: '#/components/schemas/ApprovalEnum'
        publicProperties:
          type: array
          items:
            type: string
          example: ["Nickname"]
        friendProperties:
          type: array
          items:
            type: string
        privateProperties:
          type: array
          items:
            type: string
      required:
        - addContact
    
    ContactResultState:
      type: string
      enum:
        - OK
        - Pending
        - Failed
    
    AddContactResult:
      type: object
      properties:
        userId:
          type: string
        state:
          $ref: '#/components/schemas/ContactResultState'
        message:
          type: string
      required:
        - userId
        - state
        - message
    
    ContactRequest:
      type: object
      properties:
        userId:
          type: string
        message:
          type: string
      required:
        - userId
        - message
    
    ContactOperation:
      type: string
      enum:
        - Approve
        - Deny
        - Block
    
    ContactRequestOperation:
      type: object
      properties:
        operation:
          $ref: '#/components/schemas/ContactOperation'
        userId:
          type: string
      required:
        - operation
        - userId
    
    RoomInfo:
      type: object
      properties:
        roomId:
          type: string
        title:
          type: string
        defaultConversationId:
          type: string
        properties:
          type: object
          nullable: true
          additionalProperties: true
          description: Room properties, omitted when not set.
        members:
          type: array
          items:
            type: string
          description: User IDs, included when members are requested.
      required:
        - roomId
        - title
        - defaultConversationId

    RoomInfoWithMembers:
      allOf:
        - $ref: '#/components/schemas/RoomInfo'
        - type: object
          properties:
            members:
              type: array
              items:
                type: string
              description: List of user id
          required:
            - members

    GetRoomOptions:
      type: object
      properties:
        id:
          type: string
        withMembers:
          type: boolean
      required: [id]

    SingleRoom:
      type: object
      properties:
        roomId:
          type: string
      required: [roomId]

    SingleUser:
      type: object
      properties:
        userId:
          type: string
      required: [userId]

    SingleConversation:
      type: object
      properties:
        conversation:
          $ref: '#/components/schemas/ChatConversation'
      required: [conversation]

    SingleMessage:
      type: object
      properties:
        conversation:
          $ref: '#/components/schemas/ChatConversation'
        messageId:
          type: string
      required: [conversation, messageId]

    CreateRoomRequest:
      type: object
      description: The caller is always added to members and duplicates are removed.
      properties:
        roomId:
          type: string
        title:
          type: string
          description: Optional title, at most 256 UTF-16 code units.
        members:
          type: array
          items:
            type: string
        properties:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Initial room properties; null or omission means no properties.
            The serialized JSON must fit in 64 KiB of UTF-16.

    UpdateRoomPropertiesRequest:
      type: object
      description: |
        Requires room membership and room.update_properties permission.
        An omitted or null title leaves it unchanged. An omitted properties
        value leaves it unchanged; null clears it. An object shallow-merges
        top-level fields, including null values. Both the supplied object and
        the resulting JSON must fit in 64 KiB of UTF-16.
      properties:
        roomId:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        title:
          type: string
          nullable: true
          description: Replacement title, at most 256 UTF-16 code units; an empty string is allowed.
        properties:
          type: object
          nullable: true
          additionalProperties: true
      required: [roomId]

    GetRoomMembersResponse:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/RoomMember'
      required: [members]

    CreateConversationOptions:
      type: object
      description: Requires room membership and room.create_conversation permission.
      properties:
        roomId:
          type: string
        title:
          type: string
          nullable: true
          description: Optional title, at most 256 characters.
      required: [roomId]
    
    RoomMemberJoinEnum:
      type: string
      enum:
        - AutoApprove
        - ManualApprove
        - InviteOnly
    
    RoomMessagePermissionEnum:
      type: string
      enum:
        - Allow
        - AdminOnly
        - Deny
    
    RoomReactPermissionEnum:
      type: string
      enum:
        - Allow
        - Deny
    
    RoomPolicy:
      type: object
      properties:
        memberJoin:
          $ref: '#/components/schemas/RoomMemberJoinEnum'
        messageTypeText:
          $ref: '#/components/schemas/RoomMessagePermissionEnum'
        messageTypeImage:
          $ref: '#/components/schemas/RoomMessagePermissionEnum'
        react:
          $ref: '#/components/schemas/RoomReactPermissionEnum'
      required:
        - memberJoin
    
    MessageRangeQuery:
      type: object
      properties:
        conversation:
          $ref: '#/components/schemas/ChatConversation'
        start:
          type: string
          nullable: true
          description: MessageId
        end:
          type: string
          nullable: true
          description: MessageId
        maxCount:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: Defaults to 100 when omitted or null.
      required:
        - conversation

    QueryMessageHistoryResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageInfo'
        nextQuery:
          anyOf:
            - $ref: '#/components/schemas/MessageRangeQuery'
            - type: object
              nullable: true
              enum: [null]
      required: [messages, nextQuery]
    
    MessageInfo:
      type: object
      properties:
        messageId:
          type: string
        createdBy:
          type: string
          description: UserId
        createdAt:
          type: string
          format: date-time
        content:
          $ref: '#/components/schemas/MessageContent'
        metadata:
          $ref: '#/components/schemas/MessageMetadata'
        streamId:
          type: string
          nullable: true
        etag:
          type: string
          nullable: true
        replyTo:
          type: string
          nullable: true
        mentions:
          type: array
          nullable: true
          items:
            type: string
      required: [messageId, createdBy, createdAt, content]

    MessageMetadata:
      type: object
      nullable: true
      maxProperties: 16
      description: At most 16 entries; keys are at most 32 characters and values at most 64 characters.
      additionalProperties:
        type: string

    MessageContent:
      type: object
      description: |
        For sends and edits, exactly one of text, binary, or a non-empty items
        array is required. After attachments are externalized, the stored body
        is limited to 65536 bytes. Each inline attachment is limited to 983025
        bytes. Text sizes use UTF-8 bytes and binary sizes use decoded bytes.
      properties:
        text:
          type: string
          nullable: true
        binary:
          type: string
          format: byte
          nullable: true
        items:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ContentItem'

    ContentItem:
      type: object
      properties:
        type:
          type: string
          enum: [Text, Binary]
        isAttachment:
          type: boolean
        content:
          $ref: '#/components/schemas/MessageContentItemContentOrReference'
        metadata:
          $ref: '#/components/schemas/MessageContentItemMetadata'
      required: [type, isAttachment, content]

    MessageContentItemContentOrReference:
      type: object
      properties:
        text:
          type: string
          nullable: true
        binary:
          type: string
          format: byte
          nullable: true
        reference:
          anyOf:
            - $ref: '#/components/schemas/ContentItemReference'
            - type: object
              nullable: true
              enum: [null]

    ContentItemReference:
      type: object
      description: Opaque storage location; the containing item declares its Text or Binary type.
      properties:
        storageType:
          type: string
        uri:
          type: string
      required: [storageType, uri]

    MessageContentItemMetadata:
      type: object
      nullable: true
      properties:
        contentType:
          type: string
          nullable: true
        fileName:
          type: string
          nullable: true
        size:
          type: integer
          format: int64
          nullable: true
        custom:
          $ref: '#/components/schemas/MessageMetadata'
    
    CreateTextMessage:
      type: object
      properties:
        conversation:
          $ref: '#/components/schemas/ChatConversation'
        content:
          type: string
          description: Non-whitespace text of at most 4096 UTF-16 code units.
        replyTo:
          type: string
          nullable: true
        mentions:
          type: array
          nullable: true
          maxItems: 10
          description: |
            Existing user IDs matching the .NET pattern
            ^[^\p{Cc}\/\\#?:;]{1,64}$. Agent mentions have additional validation.
          items:
            type: string
        metadata:
          $ref: '#/components/schemas/MessageMetadata'
      required: [conversation, content]
    
    MessageBody:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/MessageContent'
        replyTo:
          type: string
          nullable: true
        mentions:
          type: array
          nullable: true
          maxItems: 10
          description: |
            Existing user IDs matching the .NET pattern
            ^[^\p{Cc}\/\\#?:;]{1,64}$. Agent mentions have additional validation.
          items:
            type: string
        metadata:
          $ref: '#/components/schemas/MessageMetadata'
      required: [content]

    CreateMessageRequest:
      description: |
        replyTo must refer to a message in the same conversation. Inline
        attachment items are externalized and returned as content.reference.
      allOf:
        - $ref: '#/components/schemas/SingleConversation'
        - $ref: '#/components/schemas/MessageBody'

    CreateMessage:
      allOf:
        - $ref: '#/components/schemas/CreateMessageRequest'

    EditMessageRequest:
      description: |
        Requires the author to be a current room member with
        room.publish_message permission. The exact current etag is required;
        stale values and * are rejected. Content replaces the whole body.
        Omitted mentions, replyTo, and metadata are preserved; null clears
        them, and supplied values replace them. References may only reuse a
        storage type and URI already present in the original message. On
        success MessageUpdated contains the complete message and new etag.
      allOf:
        - $ref: '#/components/schemas/SingleMessage'
        - $ref: '#/components/schemas/MessageBody'
        - type: object
          properties:
            etag:
              type: string
          required: [etag]

    ReactToMessageOptions:
      description: |
        Replaces the caller's complete reaction set. An empty array clears it.
        Requires room.publish_reactions and sends MessageReactionUpdated.
      allOf:
        - $ref: '#/components/schemas/SingleMessage'
        - type: object
          properties:
            reactions:
              type: array
              maxItems: 16
              items:
                type: string
          required: [reactions]

    DereferenceRequest:
      description: |
        Requires room membership and room.history permission. The type and
        reference must match the same item in the current persisted message.
        Storage type comparison is case-insensitive; URI comparison is exact.
      allOf:
        - $ref: '#/components/schemas/SingleMessage'
        - type: object
          properties:
            type:
              type: string
              enum: [Text, Binary]
            reference:
              $ref: '#/components/schemas/ContentItemReference'
          required: [type, reference]

    DereferenceResult:
      type: object
      properties:
        text:
          type: string
          nullable: true
        binary:
          type: string
          format: byte
          nullable: true
        downloadUri:
          type: string
          nullable: true

    AgentMessageItem:
      type: object
      description: |
        Append data to the item identified by itemId within this message
        stream. When metadata is present it replaces the previous map. Live
        attachment notifications do not confirm persistence; wait for a
        MessageCheckPoint before dereferencing. Generated images have empty
        data and may carry contentType, fileName, and size.
      properties:
        itemId:
          type: integer
          minimum: 0
        data:
          type: string
        metadata:
          $ref: '#/components/schemas/MessageMetadata'
        isAttachment:
          type: boolean
        contentType:
          type: string
        fileName:
          type: string
        size:
          type: integer
          format: int64
      required: [itemId, data]

    MessageCheckPoint:
      description: Identifies a successfully persisted message snapshot.
      allOf:
        - $ref: '#/components/schemas/SingleMessage'
        - type: object
          properties:
            itemIndex:
              type: integer
              nullable: true
            etag:
              type: string
          required: [etag]

    CloseMessage:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required: [code, message]

    StreamNotification:
      description: Agent stream notification; body corresponds to operation.
      oneOf:
        - type: object
          properties:
            operation: { type: string, enum: [MessageItem] }
            body: { $ref: '#/components/schemas/AgentMessageItem' }
          required: [operation, body]
        - type: object
          properties:
            operation: { type: string, enum: [MessageCheckPoint] }
            body: { $ref: '#/components/schemas/MessageCheckPoint' }
          required: [operation, body]
        - type: object
          properties:
            operation: { type: string, enum: [Close] }
            body: { $ref: '#/components/schemas/CloseMessage' }
          required: [operation, body]
    
    JoinRoomState:
      type: string
      enum:
        - OK
        - Pending
        - Failed
    
    JoinRoomResult:
      type: object
      properties:
        room:
          type: string
          description: RoomId
        state:
          $ref: '#/components/schemas/JoinRoomState'
        message:
          type: string
      required:
        - room
        - state
        - message
    
    JoinRoomRequest:
      type: object
      properties:
        userId:
          type: string
        message:
          type: string
      required:
        - userId
        - message
    
    JoinRoomOperationEnum:
      type: string
      enum:
        - Approve
        - Deny
        - Block
    
    JoinRoomOperation:
      type: object
      properties:
        room:
          type: string
          description: RoomId
        userId:
          type: string
        operation:
          $ref: '#/components/schemas/JoinRoomOperationEnum'
      required:
        - room
        - userId
        - operation
    
    RoomMember:
      type: object
      properties:
        userId:
          type: string
        role:
          type: string
      required:
        - userId
        - role
    
    RoomMemberOperationEnum:
      type: string
      enum:
        - Add
        - Delete
    
    RoomMemberOperation:
      type: object
      properties:
        roomId:
          type: string
        operation:
          $ref: '#/components/schemas/RoomMemberOperationEnum'
        userId:
          type: string
      required: [roomId, operation, userId]

    RoomMemberOperationType:
      type: string
      enum:
        - Add
        - Delete

    ManageRoomMemberRequest:
      type: object
      properties:
        roomId:
          type: string
        operation:
          $ref: '#/components/schemas/RoomMemberOperationType'
        userId:
          type: string
      required:
        - roomId
        - operation
        - userId

    SendMessageResponse:
      type: object
      properties:
        id:
          type: string
      required:
        - id
